name = "dmsy_a2"
version = "0.1.0"
defaultTargets = ["A2.FPContract"]

# Module names are `A2.*`; the *namespace* inside the modules is `Frontier.DMSY`,
# per IMPLAN §2 (same convention as A1).  All units listed as roots so Lake
# schedules same-package imports.
[[lean_lib]]
name = "A2"
roots = ["A2.Search", "A2.Pivots", "A2.FPContract"]

# Order matters: mathlib first so the lane pin (d13f23b7) wins over any re-stated
# requirement in the path dependencies below.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "dmsy"
path = "../A0"

# A2 reuses A1's sweep/relaxation layer (`A1.Sweep`, `A1.BaseInv`) verbatim
# (IMPLAN §1: import, do not rebuild).
[[require]]
name = "dmsy_a1"
path = "../A1"
