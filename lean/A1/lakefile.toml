name = "dmsy_a1"
version = "0.1.0"
defaultTargets = ["A1.BaseCorrect"]

# Module names are `A1.*` (A0's lib glob owns `Frontier.DMSY.*`); the *namespace*
# inside the modules is `Frontier.DMSY`, per IMPLAN §2.  All units listed as roots
# so Lake schedules same-package imports.
[[lean_lib]]
name = "A1"
roots = ["A1.BaseCase", "A1.Sweep", "A1.BaseInv", "A1.BaseCorrect"]

# Order matters: mathlib first so the lane pin (d13f23b7) wins over any re-stated
# requirement in the path dependency below.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "dmsy"
path = "../A0"
