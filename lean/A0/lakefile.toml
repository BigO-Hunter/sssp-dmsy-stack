name = "dmsy"
version = "0.1.0"
defaultTargets = ["Frontier.DMSY"]

[[lean_lib]]
name = "Frontier.DMSY"
# Frontier.Spec / CostModel / CHD.WalkOrder are frozen c-hd-proof sources, included
# byte-identical via relative symlinks (see Frontier/); listed as roots so Lake
# schedules them (same-package imports are only built when covered by the lib).
roots = ["Frontier.DMSY", "Frontier.Spec", "Frontier.CostModel", "Frontier.CHD.WalkOrder"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"
