name = "dmsy_b"
version = "0.1.0"
defaultTargets = ["B.Main"]

# Module names are `B.*` (the *namespace* inside the modules is `Frontier.DMSY`,
# per IMPLAN §2, same convention as A1–A4).  `Frontier.RAMLogic`/`RAMRep`/`RAMWP`
# are frozen c-hd-proof sources, included byte-identical via relative symlinks
# (same convention as A0's Frontier/); listed as roots so Lake schedules them.
[[lean_lib]]
name = "B"
roots = ["B.Names", "B.Frag", "B.Rep", "B.Code", "B.Realize", "B.Main",
  "Frontier.RAMLogic", "Frontier.RAMRep", "Frontier.RAMWP"]

# Order matters: mathlib first so the lane pin (d13f23b7) wins over any re-stated
# requirement in the path dependencies below.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "dmsy"
path = "../A0"

# B is the RAM realization: it consumes A1's base case, A2's FindPivots, A3's pull
# and A4's corrected engine semantics verbatim (IMPLAN §1: import, do not rebuild).
[[require]]
name = "dmsy_a1"
path = "../A1"

[[require]]
name = "dmsy_a2"
path = "../A2"

[[require]]
name = "dmsy_a3"
path = "../A3"

[[require]]
name = "dmsy_a4"
path = "../A4"
