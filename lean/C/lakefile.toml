name = "dmsy_c"
version = "0.1.0"
defaultTargets = ["C.Bridge", "C.AxiomCheck"]

# Module names are `C.*`; the *namespace* inside the modules is `Frontier.DMSY`,
# per IMPLAN §2 (same convention as A0–A4).  C1–C4 map to CallForest / Counters /
# PerCall / Bridge.  All units listed as roots so Lake schedules same-package imports.
[[lean_lib]]
name = "C"
roots = ["Frontier.CostCharging", "C.CallForest", "C.Counters", "C.PerCall", "C.Bridge", "C.AxiomCheck"]

# Order matters: mathlib first so the lane pin (d13f23b7) wins over any re-stated
# requirement in the path dependencies below.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# C1 instantiates the call tree over A4's `Run`/`ILoop`/`ChildOf`; C4's re-settlement
# contribution is stated against A4's `dupExcess`/`LemmaR` shape (IMPLAN §2 C1–C4).
[[require]]
name = "dmsy"
path = "../A0"

[[require]]
name = "dmsy_a4"
path = "../A4"
