name = "dmsy_a3"
version = "0.1.0"
defaultTargets = ["A3.PullLoop"]

# Module names are `A3.*`; the *namespace* inside the modules is `Frontier.DMSY`,
# per IMPLAN §2 (same convention as A1/A2).  All units listed as roots so Lake
# schedules same-package imports.
[[lean_lib]]
name = "A3"
roots = ["A3.DStruct", "A3.PullInv", "A3.PullLoop"]

# Order matters: mathlib first so the lane pin (d13f23b7) wins over any re-stated
# requirement in the path dependencies below.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "dmsy"
path = "../A0"

# A3 reuses A1's sweep/relaxation layer (`A1.Sweep`, `A1.BaseCase`'s `iter`/`BState`)
# verbatim (IMPLAN §1: import, do not rebuild).
[[require]]
name = "dmsy_a1"
path = "../A1"
